<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 3 Months Aryan 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Happy 3 Months, Aryan! 💕</h1>
    <p class="subtitle">Three months of laughter, memories, and moments to treasure forever ✨</p>

    <button id="startBtn" class="btn">Click to Begin 💌</button>

    <div id="surprise" class="hidden">
      <div class="message-card">
        <h2>Dear Aryan,</h2>
        <p>
          It’s been three amazing months — filled with fun, care, and countless smiles.  
          You make every moment brighter! 🌈  
          Here’s to many more months of togetherness and happiness 💫
        </p>
        <p class="signature">With love, ❤️</p>
      </div>
      <button id="confettiBtn" class="btn">Celebrate 🎉</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
