<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Months with Aryan ❤️</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configure Tailwind to use the Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        :root {
            --primary-color: #f9a8d4; /* Pink 400 */
            --secondary-color: #fef08a; /* Yellow 200 */
            --bg-color: #1f2937; /* Gray 800 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
        }

        /* Custom Heart Animation */
        .heart-particle {
            position: absolute;
            color: var(--primary-color);
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
            user-select: none;
            transform: scale(0);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        /* Custom styling for the primary button */
        .anniversary-button {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 168, 212, 0.4);
        }

        .anniversary-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(249, 168, 212, 0.6);
        }
        
        .anniversary-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Main Container Card -->
    <div id="card" class="bg-gray-900 border-4 border-pink-400 p-6 sm:p-10 rounded-3xl w-full max-w-lg text-center shadow-2xl transition-all duration-500">
        
        <h1 id="main-title" class="text-3xl sm:text-4xl font-extrabold text-white mb-6">
            ✨ Happy 3 Month Anniversary, Aryan! ✨
        </h1>

        <!-- Memory Display Area -->
        <div id="memory-display" class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-pink-500 mb-8 min-h-[100px] flex items-center justify-center">
            <p id="current-memory" class="text-lg sm:text-xl text-yellow-200 font-semibold italic transition-opacity duration-500 opacity-100">
                Click the button below to unlock your first secret memory!
            </p>
        </div>

        <!-- Puzzle Area (Initially Hidden) -->
        <div id="puzzle-area" class="relative w-full h-40 bg-gray-700 rounded-xl border-4 border-dashed border-yellow-500 mb-6 hidden cursor-crosshair overflow-hidden p-2">
            <!-- Instruction Text inside the puzzle area -->
            <p id="puzzle-instructions" class="text-white text-sm font-bold opacity-70 mb-2">Find the Sweet Spot! Click rapidly near it to charge the memory lock.</p>
            
            <!-- Sweet Spot Target (Functionally active, visually minimal) -->
            <div id="sweet-spot" class="absolute bg-pink-400/40 rounded-full w-10 h-10 border-2 border-pink-400" style="transition: all 0.1s; transform: scale(0.5); display: none;"></div>
        </div>
        
        <!-- Progress Bar & Counter (Relocated below puzzle area) -->
        <div id="progress-bar-container" class="w-full bg-gray-700 rounded-full h-4 mb-6 hidden">
            <div id="progress-bar" class="bg-yellow-400 h-4 rounded-full transition-all duration-100 ease-linear" style="width: 0%"></div>
        </div>

        <div id="progress-container" class="mb-6 text-pink-300 font-medium text-sm sm:text-base transition-opacity duration-300">
            Memory Progress: <span id="memory-counter" class="text-white font-bold">0</span> / <span id="total-memories"></span>
        </div>

        <!-- Interactive Button -->
        <button 
            id="reveal-button"
            class="anniversary-button w-full px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full text-lg focus:outline-none focus:ring-4 focus:ring-pink-500 focus:ring-opacity-50"
            onclick="revealNextMemory()">
            Unlock Memory (Click Me!)
        </button>

        <!-- Final Message Area -->
        <div id="final-message-container" class="mt-8 p-4 bg-yellow-200/20 rounded-lg hidden">
            <p class="text-xl sm:text-2xl font-bold text-yellow-100">
                And finally...
            </p>
            <p id="final-message" class="text-white mt-2 text-base sm:text-lg">
                </p>
        </div>
    </div>

    <script>
        const memories = [
            "Remember that first time we talked for hours? I knew right then you were special.",
            "I love how you can always make me laugh, even on my worst days. You're my favorite comedian!",
            "Thank you for being the most supportive and caring person. My life is so much better with you in it.",
            "You are smart, kind, and you have the cutest smile. You make every day feel like a dream.",
            "I've loved every moment of these past three months. Here's to many, many more, my love! ❤️"
        ];
        
        let clickCount = 0;
        const MAX_PROGRESS = 100;
        const SWEET_SPOT_RADIUS = 50; // Effective radius for scoring points
        let puzzleActive = false;
        let puzzleProgress = 0;
        let sweetSpotX = 0;
        let sweetSpotY = 0;

        // DOM Elements
        const memoryCounter = document.getElementById('memory-counter');
        const totalMemories = document.getElementById('total-memories');
        const currentMemory = document.getElementById('current-memory');
        const revealButton = document.getElementById('reveal-button');
        const finalMessageContainer = document.getElementById('final-message-container');
        const finalMessage = document.getElementById('final-message');
        const card = document.getElementById('card');
        const puzzleArea = document.getElementById('puzzle-area');
        const sweetSpot = document.getElementById('sweet-spot');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');
        const puzzleInstructions = document.getElementById('puzzle-instructions');

        // Set the total number of memories
        totalMemories.textContent = memories.length;

        // --- PUZZLE LOGIC ---

        /**
         * Sets up the puzzle area with a new randomized sweet spot.
         */
        function setupPuzzle() {
            if (puzzleActive) return;
            puzzleActive = true;
            puzzleProgress = 0;
            progressBar.style.width = '0%';
            
            // Hide the button and show the puzzle elements
            revealButton.classList.add('hidden');
            puzzleArea.classList.remove('hidden');
            progressBarContainer.classList.remove('hidden');
            
            currentMemory.textContent = "Find the Sweet Spot! Click rapidly inside the pink area to charge the memory lock!";

            const areaRect = puzzleArea.getBoundingClientRect();
            
            // Calculate a random sweet spot position that is safely inside the area
            // Offset by SWEET_SPOT_RADIUS to prevent half of the spot from being off-screen
            sweetSpotX = Math.random() * (areaRect.width - SWEET_SPOT_RADIUS * 2) + SWEET_SPOT_RADIUS;
            sweetSpotY = Math.random() * (areaRect.height - SWEET_SPOT_RADIUS * 2) + SWEET_SPOT_RADIUS;
            
            // Move the visible sweet spot (small pink circle) to the calculated location
            sweetSpot.style.left = `${sweetSpotX - sweetSpot.offsetWidth / 2}px`;
            sweetSpot.style.top = `${sweetSpotY - sweetSpot.offsetHeight / 2}px`;
            sweetSpot.style.display = 'block'; // Make the visual target visible

            // Attach click handler to the puzzle area
            puzzleArea.addEventListener('click', puzzleClick);
        }
        
        /**
         * Handles the puzzle click event, updating progress based on proximity.
         * @param {Event} event The click event.
         */
        function puzzleClick(event) {
            if (!puzzleActive) return;

            // Calculate click position relative to the puzzle area's top-left corner
            const areaRect = puzzleArea.getBoundingClientRect();
            const clickX = event.clientX - areaRect.left;
            const clickY = event.clientY - areaRect.top;
            
            // Calculate distance between click and sweet spot center
            const distance = Math.sqrt(
                Math.pow(clickX - sweetSpotX, 2) + Math.pow(clickY - sweetSpotY, 2)
            );
            
            let points = 0;
            
            if (distance < SWEET_SPOT_RADIUS) {
                // Closer clicks give more points (Inverse relationship with distance)
                points = 3 + (1 - (distance / SWEET_SPOT_RADIUS)) * 7; // Max 10 points for perfect hit
                puzzleInstructions.textContent = "YES! Keep clicking the spot!";
            } else {
                points = 1; // Minimum points for clicking anywhere in the zone
                puzzleInstructions.textContent = "Miss! Try to find the pink glow!";
            }
            
            puzzleProgress += points;

            // Ensure progress doesn't exceed the max
            if (puzzleProgress > MAX_PROGRESS) {
                puzzleProgress = MAX_PROGRESS;
            }

            // Update the visual progress bar
            progressBar.style.width = `${(puzzleProgress / MAX_PROGRESS) * 100}%`;
            
            // Check if puzzle is solved
            if (puzzleProgress >= MAX_PROGRESS) {
                executeMemoryReveal();
            }
        }

        /**
         * Cleans up the puzzle elements and proceeds to the memory reveal.
         */
        function cleanupPuzzle() {
            puzzleActive = false;
            puzzleArea.removeEventListener('click', puzzleClick);

            // Hide the puzzle elements
            puzzleArea.classList.add('hidden');
            progressBarContainer.classList.add('hidden');
            sweetSpot.style.display = 'none';

            // Show the button again
            revealButton.classList.remove('hidden');
        }

        // --- TTS & UTILITY LOGIC (UNCHANGED) ---

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = pcmData.byteLength;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            let offset = 0;

            writeString(view, offset, 'RIFF'); offset += 4;
            view.setUint32(offset, 36 + dataSize, true); offset += 4;
            writeString(view, offset, 'WAVE'); offset += 4;
            writeString(view, offset, 'fmt '); offset += 4;
            view.setUint32(offset, 16, true); offset += 4;
            view.setUint16(offset, 1, true); offset += 2;
            view.setUint16(offset, numChannels, true); offset += 2;
            view.setUint32(offset, sampleRate, true); offset += 4;
            view.setUint32(offset, byteRate, true); offset += 4;
            view.setUint16(offset, blockAlign, true); offset += 2;
            view.setUint16(offset, bytesPerSample * 8, true); offset += 2;
            writeString(view, offset, 'data'); offset += 4;
            view.setUint32(offset, dataSize, true); offset += 4;

            const pcmBytes = new Uint8Array(buffer, offset);
            pcmBytes.set(new Uint8Array(pcmData.buffer));

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function playAudio(audioUrl) {
            if (!audioUrl) return Promise.resolve();
            
            return new Promise(resolve => {
                const audio = new Audio(audioUrl);
                audio.onended = () => resolve();
                audio.onerror = () => {
                    console.error("Audio playback error.");
                    resolve(); 
                };
                audio.play().catch(e => {
                    console.warn("Autoplay was prevented (interaction needed), unlocking UI.");
                    resolve();
                });
            });
        }
        
        async function speakMemory(text) {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{ text: `Say cheerfully: ${text}` }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Puck" } // Upbeat, female voice
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            const maxRetries = 5;
            let currentDelay = 1000; 

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429) {
                        await new Promise(resolve => setTimeout(resolve, currentDelay));
                        currentDelay *= 2; 
                        continue; 
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 16000;
                        
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        
                        return audioUrl; 
                    } else {
                        console.error("TTS response did not contain valid audio data.");
                        return null;
                    }
                } catch (error) {
                    console.error("Error calling TTS API or processing response:", error);
                    if (i < maxRetries - 1) {
                         await new Promise(resolve => setTimeout(resolve, currentDelay));
                         currentDelay *= 2;
                    } else {
                        return null; 
                    }
                }
            }
            return null;
        }


        function heartShower() {
            revealButton.disabled = true;
            const body = document.body;
            const numHearts = 30;

            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️'; 

                const x = Math.random() * 100; 
                const duration = Math.random() * 2 + 3; 
                const delay = Math.random() * 1; 

                heart.style.left = `${x}vw`;
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${delay}s`;
                
                body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, (duration + delay) * 1000);
            }
        }

        // --- CORE FLOW LOGIC ---

        /**
         * Executes the memory reveal (after the puzzle is solved).
         */
        async function executeMemoryReveal() {
            // Clean up puzzle elements
            cleanupPuzzle();
            
            // 1. Disable button and show processing
            revealButton.disabled = true;
            revealButton.textContent = 'Unlocking Memory...';
            
            const memoryText = memories[clickCount];

            // 2. Display the current memory
            currentMemory.textContent = memoryText;
            memoryCounter.textContent = clickCount + 1;
            
            // 3. Fetch the audio and wait for it to finish playing
            const audioUrl = await speakMemory(memoryText);
            await playAudio(audioUrl); 

            clickCount++;

            // 4. Re-enable button and update state for the next step
            if (clickCount < memories.length) {
                // Not finished yet - set up for the next click
                revealButton.textContent = `Start Puzzle for Memory ${clickCount + 1} / ${memories.length}`;
                revealButton.disabled = false;
            } else {
                // FINAL STEP
                
                // Update the card appearance for the grand finale
                card.classList.remove('border-pink-400');
                card.classList.add('border-yellow-200');
                card.classList.add('animate-pulse'); 

                // Display the final message
                finalMessage.textContent = "Happy 3 months, my wonderful Aryan. I've enjoyed every moment, and I can't wait for what's next! Love you always. - [Your Name]";
                finalMessageContainer.classList.remove('hidden');
                
                // Final button state (enabled for the last interaction)
                revealButton.textContent = "Now, I just need a big hug! 🤗";
                revealButton.onclick = heartShower; // New function for the final click
                revealButton.classList.remove('bg-pink-500');
                revealButton.classList.add('bg-yellow-500');
                revealButton.disabled = false; // Enable for the final click to trigger heart shower
                
                // Trigger the heart shower immediately as well, just for extra love!
                heartShower();
            }
        }


        /**
         * Main function to handle the button click. Now acts as a state manager.
         */
        function revealNextMemory() {
            if (clickCount < memories.length) {
                // If there are memories left, start the puzzle sequence
                setupPuzzle();
            } else {
                // This branch handles the final click set up by executeMemoryReveal
                heartShower();
            }
        }
    </script>

</body>
</html>
