<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Months with Aryan & Ridham ❤️</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configure Tailwind to use the Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        :root {
            --primary-color: #f9a8d4; /* Pink 400 */
            --secondary-color: #fef08a; /* Yellow 200 */
            --bg-color: #1f2937; /* Gray 800 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
        }

        /* Custom Heart Animation */
        .heart-particle {
            position: absolute;
            color: var(--primary-color);
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
            user-select: none;
            transform: scale(0);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        /* Custom styling for the primary button */
        .anniversary-button {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 168, 212, 0.4);
        }

        .anniversary-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(249, 168, 212, 0.6);
        }
        
        .anniversary-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Styling for the lock decoder number inputs */
        .lock-digit {
            /* Hide the default number input controls (arrows) */
            -moz-appearance: textfield;
            transition: border-color 0.2s ease, transform 0.1s ease;
        }
        .lock-digit::-webkit-outer-spin-button,
        .lock-digit::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Keyframe animation for successful flash */
        @keyframes flash-success {
            0% { border-color: #fef08a; }
            50% { border-color: #10b981; transform: scale(1.05); } /* Green 500 */
            100% { border-color: #f9a8d4; transform: scale(1); } /* Pink 400 */
        }
        .flash-success {
            animation: flash-success 0.4s ease-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Main Container Card -->
    <div id="card" class="bg-gray-900 border-4 border-pink-400 p-6 sm:p-10 rounded-3xl w-full max-w-lg text-center shadow-2xl transition-all duration-500">
        
        <h1 id="main-title" class="text-3xl sm:text-4xl font-extrabold text-white mb-6">
            ✨ Happy 3 Month Anniversary, Aryan! ✨
        </h1>

        <!-- Memory Display Area -->
        <div id="memory-display" class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-pink-500 mb-8 min-h-[120px] flex flex-col items-center justify-center">
            <img id="memory-gif" src="" alt="Romantic GIF" class="hidden rounded-lg mb-4 max-w-full h-auto" style="max-height: 150px; object-fit: cover; border: 2px solid var(--secondary-color);" 
                onerror="this.onerror=null;this.src='https://placehold.co/400x150/1f2937/fef08a?text=Loading+GIF+or+Placeholder...';" >
            <p id="current-memory" class="text-lg sm:text-xl text-yellow-200 font-semibold italic transition-opacity duration-500 opacity-100">
                Click the button below to unlock your first secret memory!
            </p>
        </div>

        <!-- Love Lock Decoder (New Puzzle Area) -->
        <div id="lock-decoder" class="w-full mb-6 hidden">
            <!-- Instruction Text inside the decoder area -->
            <p id="lock-instructions" class="text-white text-base font-medium mb-4">Decode Memory Lock <span id="current-lock-number">1</span>: Enter the 3-Digit Code!</p>
            
            <div class="flex justify-center space-x-3 sm:space-x-4">
                <!-- Lock Digit 1 -->
                <input type="number" id="lock-digit-1" min="0" max="9" maxlength="1" placeholder="?" 
                    class="lock-digit w-14 sm:w-16 h-14 sm:h-16 text-3xl text-center bg-gray-600 text-yellow-300 border-2 border-pink-500 rounded-xl focus:ring-4 focus:ring-yellow-500 focus:border-yellow-500">
                <!-- Lock Digit 2 -->
                <input type="number" id="lock-digit-2" min="0" max="9" maxlength="1" placeholder="?" 
                    class="lock-digit w-14 sm:w-16 h-14 sm:h-16 text-3xl text-center bg-gray-600 text-yellow-300 border-2 border-pink-500 rounded-xl focus:ring-4 focus:ring-yellow-500 focus:border-yellow-500">
                <!-- Lock Digit 3 -->
                <input type="number" id="lock-digit-3" min="0" max="9" maxlength="1" placeholder="?" 
                    class="lock-digit w-14 sm:w-16 h-14 sm:h-16 text-3xl text-center bg-gray-600 text-yellow-300 border-2 border-pink-500 rounded-xl focus:ring-4 focus:ring-yellow-500 focus:border-yellow-500">
            </div>
            
            <button 
                id="check-lock-button"
                class="mt-6 w-full px-4 py-3 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded-full text-md focus:outline-none focus:ring-4 focus:ring-yellow-500 focus:ring-opacity-50 transition-all duration-300"
                onclick="checkLockCode()">
                Try to Unlock
            </button>
        </div>
        
        <!-- Progress Counter (Kept for continuity) -->
        <div id="progress-container" class="mb-6 text-pink-300 font-medium text-sm sm:text-base transition-opacity duration-300">
            Memory Progress: <span id="memory-counter" class="text-white font-bold">0</span> / <span id="total-memories"></span>
        </div>

        <!-- Interactive Button -->
        <button 
            id="reveal-button"
            class="anniversary-button w-full px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full text-lg focus:outline-none focus:ring-4 focus:ring-pink-500 focus:ring-opacity-50"
            onclick="revealNextMemory()">
            Unlock Memory (Click Me!)
        </button>

        <!-- Final Message Area -->
        <div id="final-message-container" class="mt-8 p-4 bg-yellow-200/20 rounded-lg hidden">
            <p class="text-xl sm:text-2xl font-bold text-yellow-100 mb-4">
                And finally, one special picture...
            </p>
            <div class="flex flex-col items-center">
                 <!-- Image Placeholder using the uploaded file -->
                <img id="final-image" 
                     src="uploaded:image_bd836a.jpg-75cefe48-2673-4e28-b293-e01fda56e57e" 
                     alt="Ridham and Aryan together" 
                     class="rounded-xl shadow-lg w-full max-w-xs h-auto object-cover border-4 border-yellow-500 mb-4" 
                     onerror="this.onerror=null;this.src='https://placehold.co/300x200/5c6b73/ffffff?text=Our+Special+Photo';">

                <p id="final-message" class="text-white text-base sm:text-lg">
                </p>
            </div>
        </div>
    </div>

    <script>
        // Use the contentFetchId for the final image
        const finalImageContentId = "uploaded:image_bd836a.jpg-75cefe48-2673-4e28-b293-e01fda56e57e";
        
        const memories = [
            "Remember that first time we talked for hours? I knew right then you were special.",
            "I love how you can always make me laugh, even on my worst days. You're my favorite comedian!",
            "Thank you for being the most supportive and caring person. My life is so much better with you in it.",
            "You are smart, kind, and you have the cutest smile. You make every day feel like a dream.",
            "I've loved every moment of these past three months. Here's to many, many more, my love! ❤️"
        ];
        
        let clickCount = 0;

        // DOM Elements
        const memoryCounter = document.getElementById('memory-counter');
        const totalMemories = document.getElementById('total-memories');
        const currentMemory = document.getElementById('current-memory');
        const revealButton = document.getElementById('reveal-button');
        const finalMessageContainer = document.getElementById('final-message-container');
        const finalMessage = document.getElementById('final-message');
        const card = document.getElementById('card');
        const memoryGif = document.getElementById('memory-gif');
        
        // Lock Decoder elements and variables
        const lockDecoder = document.getElementById('lock-decoder');
        const lockInstructions = document.getElementById('lock-instructions');
        const checkLockButton = document.getElementById('check-lock-button');
        const finalImageElement = document.getElementById('final-image');
        const lockDigits = [
            document.getElementById('lock-digit-1'),
            document.getElementById('lock-digit-2'),
            document.getElementById('lock-digit-3')
        ];
        
        // Target code (will be set randomly on setup)
        let targetCode = []; 

        // Placeholder GIFs (REPLACE THESE WITH YOUR OWN GIF URLS for more effort!)
        const memoryGifs = [
            "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExYTlkY2Y1NjVwNG5kdW5vNmFjZWZ3OHV6ZjV0cGV3ZGFxNmd2bW5xZSZlcD12MV9pbnRlcm5hbF9naWYmY3Q9Zw/26FLdmIp6wJr91Jss/giphy.gif",
            "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F3bXN5ZWQ5Zml6N3N1c2c3ZzU3bTM2bm9yd244M3hjaW51NWRpbiZlcD12MV9pbnRlcm5hbF9naWYmY3Q9Zw/3oz8xAFtqoOUUrsh8I/giphy.gif",
            "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExcm52djczNnFwa2x0Z3R4cnA0d3A3bDBldmFub212Mmx2MW93eHlnYSZlcD12MV9pbnRlcm5hbF9naWYmY3Q9Zw/w8t7g0T1d3Bv3qQY0Y/giphy.gif",
            "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2R4d3B2MXc0bWJndG44cnJmOTJtZmYyMnJmcjZ1NG13YXlncGJwZyZlcD12MV9pbnRlcm5hbF9naWYmY3Q9Zw/l0O9z0Q57z6Jm1B1e/giphy.gif",
            "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDB5OGE3NjF1d3ZzdG50MnZ6NnN3Z3UwcXpkc2o1Z2o1ZHpsZzd6eSZlcD12MV9pbnRlcm5hbF9naWYmY3Q9Zw/l4pTfx2qLsKiUqsdq/giphy.gif"
        ];

        // Set the total number of memories
        totalMemories.textContent = memories.length;

        // --- UTILITY FUNCTIONS ---

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = pcmData.byteLength;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            let offset = 0;

            writeString(view, offset, 'RIFF'); offset += 4;
            view.setUint32(offset, 36 + dataSize, true); offset += 4;
            writeString(view, offset, 'WAVE'); offset += 4;
            writeString(view, offset, 'fmt '); offset += 4;
            view.setUint32(offset, 16, true); offset += 4;
            view.setUint16(offset, 1, true); offset += 2;
            view.setUint16(offset, numChannels, true); offset += 2;
            view.setUint32(offset, sampleRate, true); offset += 4;
            view.setUint32(offset, byteRate, true); offset += 4;
            view.setUint16(offset, blockAlign, true); offset += 2;
            view.setUint16(offset, bytesPerSample * 8, true); offset += 2;
            writeString(view, offset, 'data'); offset += 4;
            view.setUint32(offset, dataSize, true); offset += 4;

            const pcmBytes = new Uint8Array(buffer, offset);
            pcmBytes.set(new Uint8Array(pcmData.buffer));

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function playAudio(audioUrl) {
            if (!audioUrl) return Promise.resolve();
            
            return new Promise(resolve => {
                const audio = new Audio(audioUrl);
                audio.onended = () => resolve();
                audio.onerror = () => {
                    console.error("Audio playback error.");
                    resolve(); 
                };
                audio.play().catch(e => {
                    console.warn("Autoplay was prevented (interaction needed), unlocking UI.");
                    resolve();
                });
            });
        }
        
        async function speakMemory(text) {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{ text: `Say with a sweet and romantic tone: ${text}` }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Puck" } // Upbeat, clear female voice
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            const maxRetries = 5;
            let currentDelay = 1000; 

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429) {
                        await new Promise(resolve => setTimeout(resolve, currentDelay));
                        currentDelay *= 2; 
                        continue; 
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 16000;
                        
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        
                        return audioUrl; 
                    } else {
                        console.error("TTS response did not contain valid audio data.");
                        return null;
                    }
                } catch (error) {
                    console.error("Error calling TTS API or processing response:", error);
                    if (i < maxRetries - 1) {
                         await new Promise(resolve => setTimeout(resolve, currentDelay));
                         currentDelay *= 2;
                    } else {
                        return null; 
                    }
                }
            }
            return null;
        }


        function heartShower() {
            revealButton.disabled = true;
            const body = document.body;
            const numHearts = 30;

            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️'; 

                const x = Math.random() * 100; 
                const duration = Math.random() * 2 + 3; 
                const delay = Math.random() * 1; 

                heart.style.left = `${x}vw`;
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${delay}s`;
                
                body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, (duration + delay) * 1000);
            }
        }

        // --- LOCK DECODER LOGIC ---

        /**
         * Generates a new 3-digit target code and sets up the UI.
         */
        function setupLockDecoder() {
            // Hide the button and previous memory content/GIF
            revealButton.classList.add('hidden');
            memoryGif.classList.add('hidden');
            currentMemory.textContent = "Time to decode! Find the secret 3-digit code to unlock Memory " + (clickCount + 1);

            // Show lock decoder
            lockDecoder.classList.remove('hidden');
            
            // Generate a random 3-digit code (0-9 for each)
            targetCode = Array.from({ length: 3 }, () => Math.floor(Math.random() * 10));
            
            // Clear inputs and enable them
            lockDigits.forEach((input) => {
                input.value = '';
                input.disabled = false;
                input.classList.remove('border-green-500', 'border-red-500', 'flash-success');
                input.classList.add('border-pink-500');
            });

            lockInstructions.innerHTML = `Decode Love Lock <span id="current-lock-number">${clickCount + 1}</span>: Enter the 3-Digit Code!`;
            checkLockButton.disabled = false;
            checkLockButton.textContent = 'Try to Unlock';
            
            console.log("Target Code:", targetCode.join("")); // Log code for testing
        }

        /**
         * Checks the user's entered code against the target code.
         */
        function checkLockCode() {
            let correctCount = 0;
            // Get the value, convert to number, or use -1 if empty/invalid
            let userCode = lockDigits.map(input => {
                // Remove the success flash class on interaction
                input.classList.remove('flash-success'); 
                const val = parseInt(input.value);
                return (val >= 0 && val <= 9) ? val : -1;
            });

            let allFilled = userCode.every(digit => digit >= 0 && digit <= 9);
            
            if (!allFilled) {
                lockInstructions.textContent = "Please enter all three digits (0-9).";
                return;
            }

            lockDigits.forEach((input, index) => {
                const isCorrect = userCode[index] === targetCode[index];
                input.classList.remove('border-pink-500', 'border-red-500', 'border-green-500');
                
                if (isCorrect) {
                    input.classList.add('border-green-500', 'flash-success');
                    correctCount++;
                } else {
                    input.classList.add('border-red-500');
                }
            });

            if (correctCount === 3) {
                lockInstructions.innerHTML = "SUCCESS! Lock decoded! 😘 Memory Unlocked!";
                checkLockButton.disabled = true;
                lockDigits.forEach(input => input.disabled = true);
                
                // Delay slightly before revealing the memory to show success state
                setTimeout(executeMemoryReveal, 1000); 
            } else {
                lockInstructions.textContent = `[${correctCount}/3] Incorrect! The lock rattles. Try again!`;
            }
        }
        
        /**
         * Cleans up the lock decoder elements.
         */
        function cleanupLockDecoder() {
            lockDecoder.classList.add('hidden');
            
            // Reset input classes for the next round
            lockDigits.forEach(input => {
                input.classList.remove('border-green-500', 'border-red-500', 'flash-success');
                input.classList.add('border-pink-500');
            });

            // Show the button again
            revealButton.classList.remove('hidden');
        }

        // --- CORE FLOW LOGIC ---

        /**
         * Executes the memory reveal (after the lock is decoded).
         */
        async function executeMemoryReveal() {
            // Clean up lock decoder elements
            cleanupLockDecoder();
            
            // 1. Disable button and show processing
            revealButton.disabled = true;
            revealButton.textContent = 'Fetching Voice... Please Wait.';
            
            const memoryText = memories[clickCount];

            // 2. Display the current memory and GIF
            currentMemory.textContent = memoryText;
            memoryCounter.textContent = clickCount + 1;
            
            // Show GIF
            memoryGif.src = memoryGifs[clickCount];
            memoryGif.classList.remove('hidden');
            
            // 3. Fetch the audio and wait for it to finish playing
            const audioUrl = await speakMemory(memoryText);
            revealButton.textContent = 'Playing Memory Audio...';
            await playAudio(audioUrl); 

            clickCount++;

            // 4. Re-enable button and update state for the next step
            if (clickCount < memories.length) {
                // Not finished yet - set up for the next click
                revealButton.textContent = `Start Decoder for Memory ${clickCount + 1} / ${memories.length}`;
                revealButton.disabled = false;
            } else {
                // FINAL STEP
                
                // Update the card appearance for the grand finale
                card.classList.remove('border-pink-400');
                card.classList.add('border-yellow-200');
                card.classList.add('animate-pulse'); 

                // Display the final message
                finalMessage.textContent = "Happy 3 months, my wonderful Aryan. I've enjoyed every moment, and I can't wait for what's next! Love you always. - Ridham";
                finalMessageContainer.classList.remove('hidden');
                memoryGif.classList.add('hidden'); // Hide the last GIF
                finalImageElement.classList.remove('hidden'); // Ensure final image is shown
                
                // Final button state (enabled for the last interaction)
                revealButton.textContent = "Now, I just need a big hug! 🤗";
                revealButton.onclick = heartShower; // New function for the final click
                revealButton.classList.remove('bg-pink-500');
                revealButton.classList.add('bg-yellow-500');
                revealButton.disabled = false; // Enable for the final click to trigger heart shower
                
                // Trigger the heart shower immediately as well, just for extra love!
                heartShower();
            }
        }


        /**
         * Main function to handle the button click. Now acts as a state manager.
         */
        function revealNextMemory() {
            if (clickCount < memories.length) {
                // If there are memories left, start the lock decoder sequence
                setupLockDecoder();
            } else {
                // This branch handles the final click set up by executeMemoryReveal
                heartShower();
            }
        }
    </script>

</body>
</html>
