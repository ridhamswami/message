<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aloo ❤️</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configure Tailwind to use the Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        :root {
            --primary-color: #f9a8d4; /* Pink 400 */
            --secondary-color: #fef08a; /* Yellow 200 */
            --bg-color: #1f2937; /* Gray 800 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
        }

        /* Custom Heart/Confetti Animation */
        .heart-particle {
            position: absolute;
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
            user-select: none;
            transform: scale(0);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        /* Custom styling for the primary button */
        .anniversary-button {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 168, 212, 0.4);
        }

        .anniversary-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(249, 168, 212, 0.6);
        }
        
        .anniversary-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Background Audio Element (Starts muted to comply with autoplay rules) -->
    <audio id="bg-music" loop autoplay muted>
        <!-- NOTE: The URL below is a royalty-free placeholder. 
             You MUST replace it with a non-copyrighted version of "For a Reason" 
             or another track you have rights to use! -->
        <source id="music-source" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/191814/elvispresleyfallinginlove).mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Main Container Card -->
    <div id="card" class="bg-gray-900 border-4 border-pink-400 p-6 sm:p-10 rounded-3xl w-full max-w-lg text-center shadow-2xl transition-all duration-500">
        
        <h1 id="main-title" class="text-3xl sm:text-4xl font-extrabold text-white mb-6">
            ✨ Happy 3 Month Anniversary, Bubu! ✨
        </h1>

        <!-- Music Control -->
        <div class="mb-6">
             <button 
                id="music-toggle-button"
                class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-full text-sm focus:outline-none focus:ring-4 focus:ring-pink-500 focus:ring-opacity-50 transition-all">
                🔈 Play Music (Click to Start)
            </button>
        </div>

        <!-- Memory Display Area -->
        <div id="memory-display" class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-pink-500 mb-8 min-h-[120px] flex flex-col items-center justify-center">
            <!-- This element is now used for images instead of GIFs -->
            <img id="memory-gif" src="" alt="Romantic Photo" class="hidden rounded-lg mb-4 max-w-full h-auto" style="max-height: 150px; object-fit: cover; border: 2px solid var(--secondary-color);" 
                onerror="this.onerror=null;this.src='https://placehold.co/400x150/1f2937/fef08a?text=Loading+Image...';" >
            <p id="current-memory" class="text-lg sm:text-xl text-yellow-200 font-semibold italic transition-opacity duration-500 opacity-100">
                Click the button below to unlock my favorite memories of us!
            </p>
        </div>
        
        <!-- Progress Counter -->
        <div id="progress-container" class="mb-6 text-pink-300 font-medium text-sm sm:text-base transition-opacity duration-300">
            Memory Progress: <span id="memory-counter" class="text-white font-bold">0</span> / <span id="total-memories"></span>
        </div>

        <!-- Interactive Button -->
        <button 
            id="reveal-button"
            class="anniversary-button w-full px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full text-lg focus:outline-none focus:ring-4 focus:ring-pink-500 focus:ring-opacity-50"
            onclick="revealNextMemory()">
            Unlock Memory (Click Me!)
        </button>

        <!-- Final Message Area -->
        <div id="final-message-container" class="mt-8 p-4 bg-yellow-200/20 rounded-lg hidden">
            <p class="text-xl sm:text-2xl font-bold text-yellow-100 mb-4">
                See, we look so good together🤭...
            </p>
            <div class="flex flex-col items-center">
                 <!-- Image Placeholder using the specific final image URL -->
                 <img id="final-image" 
                     src="https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0179.jpg" 
                     alt="Ridham and Aryan together" 
                     class="rounded-xl shadow-lg w-full max-w-xs h-auto object-cover border-4 border-yellow-500 mb-4" 
                     onerror="this.onerror=null;this.src='https://placehold.co/300x200/5c6b73/ffffff?text=Our+Special+Photo';">

                <p id="final-message" class="text-white text-base sm:text-lg">
                </p>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Final image URL configuration (Updated to the raw GitHub link)
        const finalImageContentId = "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0179.jpg"; 
        
        const memories = [
            "Remember that first time you said I love you, it was lubbbuuuuuuu, that Lubbuuuu means everything to me ❤️",
            "This song always reminds me of that first shower we had together, haha the most fun and romantic one. Stay same always Aloo.",
            "The first sex we had, the way you looked into my eyes, I knew right then you were that special guy I wanna experience everything ahead in life. I miss those cuddles baby.",
            "When you brought me your fav jersey, I could feel the affection in your words and that little dream of yours is now one of my most cherished memories",
            "Last but not the least, when Yuvika called me Mummaaaa, and you were like Mumma nhi hai beta vo Mami hai. The BEST feeling ever. and Here's to many, many more, my love! ❤️"
        ];
        
        // --- Placeholder Images (REPLACE THESE with your actual image URLs!) ---
        const memoryImages = [
            "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0176.jpg", 
            "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0177.jpg",
            "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0180.jpg",
            "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0181.jpg",
            "https://raw.githubusercontent.com/ridhamswami/message/main/assets/IMG-20251005-WA0179.jpg"
        ];
        
        let clickCount = 0;

        // --- DOM Elements ---
        const memoryCounter = document.getElementById('memory-counter');
        const totalMemories = document.getElementById('total-memories');
        const currentMemory = document.getElementById('current-memory');
        const revealButton = document.getElementById('reveal-button');
        const finalMessageContainer = document.getElementById('final-message-container');
        const finalMessage = document.getElementById('final-message');
        const card = document.getElementById('card');
        const memoryGif = document.getElementById('memory-gif'); // Retaining ID for continuity, but now holds an image
        const finalImageElement = document.getElementById('final-image');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleButton = document.getElementById('music-toggle-button');
        
        // Initialize
        totalMemories.textContent = memories.length;

        // --- MUSIC CONTROL ---

        // Function to handle the music toggle (satisfies browser policy)
        function toggleMusic() {
            if (bgMusic.muted) {
                // If muted, attempt to unmute and play
                bgMusic.muted = false;
                bgMusic.play().then(() => {
                    musicToggleButton.textContent = '🔊 Music Playing (Click to Mute)';
                    musicToggleButton.classList.remove('bg-pink-600');
                    musicToggleButton.classList.add('bg-green-600');
                }).catch(error => {
                    console.error("Autoplay/Play was prevented:", error);
                    // If it still fails, mute it back and notify the user
                    bgMusic.muted = true;
                    musicToggleButton.textContent = '🚫 Music Blocked (Try another browser)';
                    musicToggleButton.classList.remove('bg-pink-600');
                    musicToggleButton.classList.add('bg-red-600');
                });
            } else {
                // If playing, mute it
                bgMusic.muted = true;
                musicToggleButton.textContent = '🔈 Play Music (Click to Start)';
                musicToggleButton.classList.remove('bg-green-600');
                musicToggleButton.classList.add('bg-pink-600');
            }
        }

        // Attach the music toggle to the button
        musicToggleButton.addEventListener('click', toggleMusic);

        // --- PARTY POPPERS/CONFETTI EFFECT ---

        function confettiShower() {
            const colors = ['#f9a8d4', '#fef08a', '#ffffff', '#ef4444']; // Pink, Yellow, White, Red
            const shapes = ['❤️', '🎉', '✨', '💖']; // Hearts, Poppers, Sparkles
            const body = document.body;
            const numParticles = 40;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'heart-particle'; // Using existing class for animation
                
                // Randomly select shape and color
                const content = shapes[Math.floor(Math.random() * shapes.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];

                particle.innerHTML = content; 
                particle.style.color = color;
                particle.style.fontSize = `${Math.random() * 10 + 15}px`; // Vary size

                const x = Math.random() * 100; 
                const duration = Math.random() * 2 + 3; 
                const delay = Math.random() * 1; 

                particle.style.left = `${x}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, (duration + delay) * 1000);
            }
        }

        // --- CORE FLOW LOGIC ---

        /**
         * Main function to handle the button click and reveal the next memory.
         */
        async function revealNextMemory() {
            // Check if we have revealed all memories and should trigger the final action
            if (clickCount >= memories.length) {
                confettiShower(); // Final click action for confetti
                return;
            }

            // 1. Disable button during transition
            revealButton.disabled = true;
            revealButton.textContent = 'Unlocking Memory...';
            
            const memoryText = memories[clickCount];

            // 2. Display the current memory and Image instantly
            currentMemory.textContent = memoryText;
            memoryCounter.textContent = clickCount + 1;
            
            // Show Image (uses the new memoryImages array)
            memoryGif.src = memoryImages[clickCount];
            memoryGif.classList.remove('hidden');
            
            // Trigger the Party Poppers/Confetti effect
            confettiShower();
            
            // 3. Wait a moment for visual effect 
            await new Promise(resolve => setTimeout(resolve, 500));

            clickCount++;

            // 4. Re-enable button and update state for the next step
            if (clickCount < memories.length) {
                // Not finished yet - set up for the next click
                revealButton.textContent = `Unlock Next Memory ${clickCount + 1} / ${memories.length}`;
                revealButton.disabled = false;
            } else {
                // FINAL STEP
                
                // Update the card appearance for the grand finale
                card.classList.remove('border-pink-400');
                card.classList.add('border-yellow-200');
                card.classList.add('animate-pulse'); 

                // Set the final image source and ensure it's visible
                finalImageElement.src = finalImageContentId;
                finalImageElement.classList.remove('hidden');

                // Display the final message
                finalMessage.textContent = "Happy 3 months, Love💖. I just loveee every moment when you're with me, and I am sorry for all my mistakes but genuinely, Love you cutie <3 - Ridham";
                finalMessageContainer.classList.remove('hidden');
                memoryGif.classList.add('hidden'); // Hide the last memory image
                
                
                // Final button state
                revealButton.textContent = "I just need a veryyy tighttt hug now! 🤗";
                revealButton.onclick = confettiShower; // The final click triggers one last confetti burst
                revealButton.classList.remove('bg-pink-500');
                revealButton.classList.add('bg-yellow-500');
                revealButton.disabled = false; 
                
                // Also trigger the confetti shower for the grand reveal
                confettiShower();
            }
        }
    </script>

</body>
</html>
